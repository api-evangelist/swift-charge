description: Swift Charge is an electric vehicle charging company that provides turn-key,
  fully managed EV charging infrastructure to property owners across the hospitality,
  education, and multi-family residential sectors, pairing installed charging hardware
  with a payment application that lets EV drivers locate and pay for charging sessions.
  It was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. As of this enrichment pass Swift Charge publishes a public marketing and
  charger-map website but exposes no public developer API, documentation, SDKs, or
  developer portal, so this profile is limited to company identity plus a domain-security
  probe of its website host.
